name: AvenraDash build toolchain
on:
  push:
    branches: ['build/avenradash-0.2.0-toolchain']
    paths: ['.github/workflows/avenradash-toolchain.yml']
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android and Gradle
        run: |
          set -eux
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | head -1)
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
          curl -fLsS https://downloads.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          echo '20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  /tmp/gradle.zip' | sha256sum -c
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Warm exact build and test dependencies
        run: |
          mkdir -p /tmp/warm/app/src/main/java/com/avenra/halo/nativecompanion /tmp/warm/app/src/test/java/com/avenra/halo/nativecompanion
          cd /tmp/warm
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='AvenraDash'
          include ':app'
          EOF
          echo "plugins { id 'com.android.application' version '8.13.0' apply false }" > build.gradle
          echo 'android.useAndroidX=true' > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.avenra.halo.nativecompanion'
            compileSdk 36
            buildToolsVersion '35.0.0'
            defaultConfig { applicationId 'com.avenra.dash'; minSdk 26; targetSdk 36; versionCode 2; versionName '0.2.0' }
            buildFeatures { buildConfig true }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            testOptions { unitTests.includeAndroidResources = true }
          }
          dependencies {
            implementation 'androidx.car.app:app:1.7.0'
            implementation 'androidx.car.app:app-projected:1.7.0'
            implementation 'androidx.webkit:webkit:1.15.0'
            implementation 'androidx.core:core:1.1.0'
            testImplementation 'junit:junit:4.13.2'
            testImplementation 'org.json:json:20250107'
            testImplementation 'org.robolectric:robolectric:4.16'
          }
          EOF
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@android:style/Theme.Material.NoActionBar" android:label="AvenraDash"><activity android:name=".WarmActivity" android:exported="false"/></application></manifest>' > app/src/main/AndroidManifest.xml
          echo 'package com.avenra.halo.nativecompanion; public class WarmActivity extends android.app.Activity { public void onCreate(android.os.Bundle b){super.onCreate(b);setContentView(new android.webkit.WebView(this));}}' > app/src/main/java/com/avenra/halo/nativecompanion/WarmActivity.java
          cat > app/src/test/java/com/avenra/halo/nativecompanion/WarmTest.java <<'EOF'
          package com.avenra.halo.nativecompanion;
          import org.junit.Test;
          import org.junit.runner.RunWith;
          import org.robolectric.RobolectricTestRunner;
          import org.robolectric.Robolectric;
          import org.robolectric.annotation.Config;
          @RunWith(RobolectricTestRunner.class) @Config(sdk={35,36})
          public class WarmTest {
            @Test public void launch(){ try(var controller=Robolectric.buildActivity(WarmActivity.class).setup()){org.junit.Assert.assertNotNull(controller.get());} }
          }
          EOF
          /tmp/gradle-8.13/bin/gradle --no-daemon --max-workers=2 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Package offline build kit
        if: always()
        run: |
          mkdir -p /tmp/kit/sdk/build-tools /tmp/kit/sdk/platforms /tmp/kit/gradle-home /tmp/kit/m2
          cp -a "$ANDROID_HOME/build-tools/35.0.0" /tmp/kit/sdk/build-tools/
          cp -a "$ANDROID_HOME/platforms/android-36" /tmp/kit/sdk/platforms/
          cp -a "$ANDROID_HOME/platform-tools" /tmp/kit/sdk/
          cp -a "$ANDROID_HOME/licenses" /tmp/kit/sdk/
          cp -a /tmp/gradle-8.13 /tmp/kit/
          cp -a "$HOME/.gradle/caches" /tmp/kit/gradle-home/
          if [ -d "$HOME/.m2/repository" ]; then cp -a "$HOME/.m2/repository" /tmp/kit/m2/; fi
          if [ -d /tmp/warm/app/build/reports ]; then cp -a /tmp/warm/app/build/reports /tmp/kit/warm-reports; fi
          find /tmp/kit -name '*.lock' -delete
          tar -czf /tmp/avenradash-offline-kit.tgz -C /tmp/kit .
          ls -lh /tmp/avenradash-offline-kit.tgz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avenradash-offline-kit
          path: /tmp/avenradash-offline-kit.tgz
          retention-days: 1
          compression-level: 0
